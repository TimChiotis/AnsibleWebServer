---
- name: Install nginx
  ansible.builtin.apt:
    name: nginx
    state: present
    update_cache: true
    cache_valid_time: 3600

- name: Create document root
  ansible.builtin.file:
    path: "{{ nginx_docroot }}"
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Deploy HTML pages
  ansible.builtin.template:
    src: page.html.j2
    dest: "{{ nginx_docroot }}/{{ item.file }}"
    owner: root
    group: root
    mode: "0644"
  loop: "{{ nginx_pages }}"
  loop_control:
    label: "{{ item.file }}"

- name: Deploy site configuration
  ansible.builtin.template:
    src: site.conf.j2
    dest: "/etc/nginx/sites-available/{{ nginx_site_name }}"
    owner: root
    group: root
    mode: "0644"
  notify: Reload nginx

- name: Enable site
  ansible.builtin.file:
    src: "/etc/nginx/sites-available/{{ nginx_site_name }}"
    dest: "/etc/nginx/sites-enabled/{{ nginx_site_name }}"
    state: link
  notify: Reload nginx

- name: Disable default site
  ansible.builtin.file:
    path: /etc/nginx/sites-enabled/default
    state: absent
  notify: Reload nginx

- name: Ensure nginx is started and enabled
  ansible.builtin.service:
    name: nginx
    state: started
    enabled: true
