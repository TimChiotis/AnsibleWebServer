[defaults]
inventory = inventory/hosts.yml
roles_path = roles
private_key_file = ~/.ssh/ansible
interpreter_python = auto_silent
callback_result_format = yaml

[ssh_connection]
ssh_args = -o ControlMaster=auto -o ControlPersist=60s -o StrictHostKeyChecking=accept-new -o UserKnownHostsFile=~/.ssh/known_hosts_aws
