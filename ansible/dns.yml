---
- name: Manage the DNS records of this group
  hosts: localhost
  connection: local
  gather_facts: false
  vars_files:
    - vault/gandi.yml
  vars:
    dns_state: present
    dns_domain: dummy-domain.app
    dns_subdomain: groep2
    dns_api: "https://api.gandi.net/v5/livedns/domains/{{ dns_domain }}/records"
    dns_records: "{{ lookup('ansible.builtin.pipe', 'terraform -chdir=../terraform output -json public_ips') | from_json }}"
    dns_missing_ip: "{{ dns_records | dict2items | selectattr('value', 'equalto', '') | map(attribute='key') | list }}"
  tasks:
    - name: Accept only present or absent as dns_state
      ansible.builtin.assert:
        that: dns_state in ['present', 'absent']
        fail_msg: "dns_state must be present or absent, not {{ dns_state }}."
        quiet: true

    - name: Refuse to write records for hosts without a public IP
      ansible.builtin.assert:
        that: dns_missing_ip | length == 0
        fail_msg: >-
          No public IP for {{ dns_missing_ip | join(', ') }}.
          Stopped? Start the instances, run terraform apply -refresh-only
          and write the inventory again.
        quiet: true
      when: dns_state == 'present'

    - name: Read current A records
      ansible.builtin.uri:
        url: "{{ dns_api }}/{{ item.key }}.{{ dns_subdomain }}/A"
        headers:
          Authorization: "Bearer {{ gandi_pat }}"
        status_code: [200, 404]
      loop: "{{ dns_records | dict2items }}"
      loop_control:
        label: "{{ item.key }}.{{ dns_subdomain }}.{{ dns_domain }}"
      register: dns_current
      until: dns_current.status | default(0) in [200, 404]
      retries: 3
      delay: 5

    - name: Set A records that are missing or point elsewhere
      ansible.builtin.uri:
        url: "{{ dns_api }}/{{ item.item.key }}.{{ dns_subdomain }}/A"
        method: PUT
        headers:
          Authorization: "Bearer {{ gandi_pat }}"
        body_format: json
        body:
          rrset_values: ["{{ item.item.value }}"]
          rrset_ttl: 300
        status_code: [200, 201]
      loop: "{{ dns_current.results }}"
      loop_control:
        label: "{{ item.item.key }}.{{ dns_subdomain }}.{{ dns_domain }} -> {{ item.item.value }}"
      when:
        - dns_state == 'present'
        - item.status == 404 or item.json.rrset_values != [item.item.value]
      register: dns_set
      until: dns_set.status | default(0) in [200, 201]
      retries: 3
      delay: 5
      changed_when: true

    - name: Delete A records that still exist
      ansible.builtin.uri:
        url: "{{ dns_api }}/{{ item.item.key }}.{{ dns_subdomain }}/A"
        method: DELETE
        headers:
          Authorization: "Bearer {{ gandi_pat }}"
        status_code: [204]
      loop: "{{ dns_current.results }}"
      loop_control:
        label: "{{ item.item.key }}.{{ dns_subdomain }}.{{ dns_domain }}"
      when:
        - dns_state == 'absent'
        - item.status == 200
      register: dns_deleted
      until: dns_deleted.status | default(0) == 204
      retries: 3
      delay: 5
      changed_when: true
